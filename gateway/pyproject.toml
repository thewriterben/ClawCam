[project]
name = "clawcam-gateway"
version = "0.1.0"
description = "Offline-first ClawCam field gateway for ingest, storage, diagnostics, and agent tools."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
  "httpx>=0.27"
]
# Optional model runtimes — install with: pip install "clawcam-gateway[vision]"
vision = [
  "torch>=2.0",
  "pillow>=10.0"
]
# Optional OCR runtime (license-plate reading) — pip install "clawcam-gateway[ocr]"
ocr = [
  "easyocr>=1.7"
]
# Optional face recognition (home security) — pip install "clawcam-gateway[faces]"
faces = [
  "face-recognition>=1.3"
]

[tool.pytest.ini_options]
# tests/evals is the Phase 13 WS4 release gate: no release while evals regress.
testpaths = ["../tests/gateway", "../tests/schemas", "../tests/evals", "../tests/integration", "../tests/firmware"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # paho, ultralytics, boto3, etc. are optional/untyped
warn_unused_ignores = false  # paho/pillow present in CI but not locally; keeps results stable
no_implicit_optional = true
