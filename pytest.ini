# Root pytest config: makes `pytest` from the repo root behave like CI
# (which runs from gateway/ using gateway/pyproject.toml). Keep the two in sync.
[pytest]
testpaths = tests/gateway tests/schemas tests/evals tests/integration tests/firmware
pythonpath = gateway brain/oh-ben-claw-adapter
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
