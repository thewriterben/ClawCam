name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch/PR when a new commit arrives.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff + mypy
        run: python -m pip install --upgrade pip ruff mypy

      - name: Ruff check
        run: python -m ruff check --config gateway/pyproject.toml gateway/clawcam_gateway brain/oh-ben-claw-adapter

      - name: Mypy (gateway)
        working-directory: gateway
        run: python -m mypy clawcam_gateway

  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the package itself so pyproject metadata (deps, extras) is
      # exercised by CI instead of a hand-maintained list that can drift.
      # paho-mqtt comes from the [mqtt] extra (test_phase3b_mqtt imports it).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "gateway/[dev,mqtt]" 

      # The full gated suite is defined by `testpaths` in gateway/pyproject.toml
      # (gateway, schemas, evals, integration, firmware). Running pytest from the
      # gateway/ directory makes that config the single source of truth, so CI and
      # local runs cover exactly the same tests.
      - name: Run gated test suite
        working-directory: gateway
        env:
          PYTHONPATH: ${{ github.workspace }}/brain/oh-ben-claw-adapter
        run: pytest --tb=short
